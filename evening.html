<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台中捷運小車長大闖關</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f1f8f5; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; }
        .header-banner { background-color: #4CAF50; color: white; padding: 12px; border-radius: 12px; font-size: 20px; font-weight: bold; margin-bottom: 15px; }

        .timer-box { background: #fff8e1; border: 2px solid #ffe082; border-radius: 15px; padding: 20px 15px; margin-bottom: 20px; }
        .current-task-name { font-size: 20px; font-weight: bold; color: #e65100; margin-bottom: 5px; line-height: 1.5; }
        
        button { font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; padding: 12px 20px; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-complete { background: #2196F3; color: white; padding: 15px; border-radius: 12px; }

        .route-map { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 15px; padding: 15px; height: 350px; display: flex; flex-direction: column; }
        .route-title { font-size: 16px; font-weight: bold; color: #444; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #ddd; flex-shrink: 0; }
        .scroll-area { flex-grow: 1; overflow-y: auto; text-align: left; padding-left: 25px; position: relative; }
        .scroll-area::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 4px; background: #a5d6a7; }

        .station-item { position: relative; margin-bottom: 15px; font-size: 15px; color: #999; display: flex; align-items: center; }
        .station-dot { position: absolute; left: -22px; width: 12px; height: 12px; background: white; border: 2px solid #a5d6a7; border-radius: 50%; }
        .station-item.passed { color: #4CAF50; }
        .station-item.passed .station-dot { background: #4CAF50; border-color: #4CAF50; }
        .station-item.active { color: #1b5e20; font-weight: bold; font-size: 17px; }
        .station-item.active .station-dot { background: #1b5e20; border-color: #1b5e20; box-shadow: 0 0 8px rgba(27,94,32,0.5); }
        
        .custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .alert-box { background: white; padding: 25px; border-radius: 15px; text-align: center; max-width: 320px; }
        .alert-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .celebration { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; text-align: center; color: white; }
        .celebration h2 { color: #ffeb3b; font-size: 32px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-banner">🚇 台中捷運大闖關 🚇</div>
    
    <div class="timer-box" id="timerSection">
        <div class="current-task-name" id="taskName">準備出發！</div>
        
        <!-- 操作按鈕區：完成與未完成並排 -->
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-complete" id="completeBtn" style="flex: 7; margin-top: 0;" onclick="completeTask()">任務完成！</button>
            <button id="failBtn" style="flex: 3; background: #e0e0e0; color: #555; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;" onclick="failTask()">未完成 😥</button>
        </div>
        
        <button style="margin-top:15px; background:#4caf50; color:white; width: 100%;" onclick="copyShareLink()">🔗 複製目前進度連結給隊友</button>
    </div>
    
    <div class="route-map">
        <div class="route-title">捷運綠線全線圖</div>
        <div class="scroll-area" id="stationListContainer"></div>
    </div>
    
    <button style="margin-top:15px; background:#eee;" onclick="resetGame()">重設遊戲</button>
</div>

<!-- 勝利彈窗 -->
<div class="celebration" id="victoryScreen">
    <h2>🎉 任務全數達成！ 🎉</h2>
    <p id="victoryMsg"></p>
    <div style="font-size: 60px; margin-bottom: 20px;">🎫 🏆 🚇</div>
    <button style="background: #ffeb3b; color: #333; font-size: 18px; padding: 12px 30px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer;" onclick="resetGame()">重置地圖，再次挑戰！</button>
</div>

<!-- 自訂提示視窗 -->
<div class="custom-alert" id="customAlert">
    <div class="alert-box">
        <div id="alertTitle" style="font-weight:bold; margin-bottom:10px; font-size: 20px;">提示</div>
        <div id="alertMsg" style="margin-bottom:20px; line-height: 1.5; color: #555;"></div>
        <button class="alert-btn" onclick="closeAlert()">我知道了！</button>
    </div>
</div>

<script>
    // 你的日常任務清單
    const tasks = [
        { name: "1. 拿衣服 + 洗澡" },
        { name: "2. 擦身體 + 穿衣服" },
        { name: "3. 吃飯" },
        { name: "4. 收碗 + 擦桌子" },
        { name: "5. 吃水果" },
        { name: "6. 收碗、擦桌子 2" },
        { name: "7. 收書包" },
        { name: "8. 刷牙 + 爸媽加強 + 尿尿" },
        { name: "9. 換衣服" }
    ];

    // 站點與音檔設定 (.mp3)
    const stations = [
        { name: "北屯總站", audio: "" },
        { name: "舊社", audio: "01.mp3" },
        { name: "松竹", audio: "02.mp3" },
        { name: "四維國小", audio: "03.mp3" },
        { name: "文心崇德", audio: "04.mp3" },
        { name: "文心中清", audio: "05.mp3" },
        { name: "文華高中", audio: "06.mp3" },
        { name: "文心櫻花", audio: "07.mp3" },
        { name: "市政府", audio: "08.mp3" },
        { name: "水安宮", audio: "09.mp3" },
        { name: "文心森林公園", audio: "10.mp3" },
        { name: "南屯", audio: "11.mp3" },
        { name: "豐樂公園", audio: "12.mp3" },
        { name: "大慶", audio: "13.mp3" },
        { name: "九張犁", audio: "14.mp3" },
        { name: "九德", audio: "15.mp3" },
        { name: "烏日", audio: "16.mp3" },
        { name: "高鐵臺中站", audio: "17.mp3" }
    ];

    let currentStation = 0, currentTaskIndex = 0;
    let currentStationAudio = null;

    window.onload = () => { checkUrlParams(); renderRouteMap(); updateUI(); };

    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const s = urlParams.get('station');
        const t = urlParams.get('task');
        if (s !== null && t !== null) {
            currentStation = parseInt(s, 10);
            currentTaskIndex = parseInt(t, 10);
        } else {
            loadProgress();
        }
    }

    function copyShareLink() {
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?station=${currentStation}&task=${currentTaskIndex}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert("連結已複製！現在可以傳給隊友，他點開就會是目前的進度喔！");
        });
    }

    function renderRouteMap() {
        const container = document.getElementById("stationListContainer");
        container.innerHTML = "";
        stations.forEach((s, i) => {
            let suffix = "";
            if (i === 0) suffix = " (起點)";
            if (i === stations.length - 1) suffix = " (終點站)";
            container.innerHTML += `<div class="station-item" id="station-${i}"><div class="station-dot"></div><span>${s.name}${suffix}</span></div>`;
        });
    }

    function updateUI() {
        stations.forEach((_, i) => {
            const el = document.getElementById(`station-${i}`);
            if(el) el.className = `station-item ${i < currentStation ? 'passed' : ''} ${i === currentStation ? 'active' : ''}`;
        });
        const active = document.getElementById(`station-${currentStation}`);
        if(active) active.scrollIntoView({ behavior: "smooth", block: "center" });
        
        if (currentTaskIndex >= tasks.length) {
            showVictoryScreen();
        } else {
            let nextStationName = currentStation + 1 < stations.length ? stations[currentStation + 1].name + "站" : "最後一站";
            document.getElementById("taskName").innerHTML = `<b>目前停靠：</b>${stations[currentStation].name}站<br><span style="font-size:15px; color:#555;">(下一站目標：${nextStationName})</span><br><br>🎯 第 ${currentTaskIndex + 1} 關：${tasks[currentTaskIndex].name}`;
        }
    }

    // 任務完成：捷運前進 1 站，關卡往前，播放進站音檔
    function completeTask() {
        currentStation += 1;
        if (currentStation >= stations.length) currentStation = stations.length - 1;
        
        playSound('success');
        playStationAudio(currentStation);
        
        currentTaskIndex++;
        saveProgress();
        updateUI();
    }
    
    // 任務失敗：捷運停在原地，關卡往前
    function failTask() {
        if(confirm("確定要放棄這個任務嗎？捷運將會停在原地喔！")) {
            playSound('fail');
            showAlert("💨 任務略過", "這次沒有順利完成任務，所以捷運先停在原地休息。<br><br><b>沒關係，我們深呼吸調整一下，準備挑戰下一關！</b>💪", "#757575");
            
            currentTaskIndex++;
            saveProgress();
            updateUI();
        }
    }
    
    // 播放 .mp3 進站音樂
    function playStationAudio(stationIndex) {
        if (currentStationAudio) {
            currentStationAudio.pause();
            currentStationAudio.currentTime = 0;
        }
        
        const audioFile = stations[stationIndex].audio;
        if (audioFile) {
            currentStationAudio = new Audio(audioFile);
            currentStationAudio.play().catch(e => console.log("等待音檔上傳或瀏覽器阻擋自動播放", e));
        }
    }

    function showVictoryScreen() {
        document.getElementById("victoryScreen").style.display = "flex";
        document.getElementById("timerSection").style.display = "none";
        playSound('victory');
        let msg = `今天的日常任務全部結束！<br><br>小車長把捷運一路開到了<br><span style='font-size: 28px; color: #4CAF50; font-weight: bold; background: white; padding: 5px 10px; border-radius: 10px; display: inline-block; margin-top: 10px;'>🚉 ${stations[currentStation].name}站</span>！`;
        document.getElementById("victoryMsg").innerHTML = msg;
    }

    function showAlert(t, m, c) {
        document.getElementById("alertTitle").innerText = t;
        if(c) document.getElementById("alertTitle").style.color = c;
        document.getElementById("alertMsg").innerHTML = m;
        document.getElementById("customAlert").style.display = "flex";
    }
    function closeAlert() { document.getElementById("customAlert").style.display = "none"; }
    
    function resetGame() {
        if(confirm("確定要重設所有進度回到起點嗎？")) {
            currentStation = 0;
            currentTaskIndex = 0;
            saveProgress();
            window.location.href = window.location.origin + window.location.pathname; 
        }
    }

    function saveProgress() {
        localStorage.setItem("mrt_game_station", currentStation);
        localStorage.setItem("mrt_game_task", currentTaskIndex);
    }

    function loadProgress() {
        const s = localStorage.getItem("mrt_game_station");
        const t = localStorage.getItem("mrt_game_task");
        if (s !== null && t !== null) {
            currentStation = parseInt(s, 10);
            currentTaskIndex = parseInt(t, 10);
            if (currentStation >= stations.length) currentStation = stations.length - 1;
            if (currentTaskIndex > tasks.length) currentTaskIndex = 0;
        }
    }

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } else if (type === 'fail') {
                osc.frequency.setValueAtTime(349.23, ctx.currentTime);
                osc.frequency.setValueAtTime(293.66, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.6);
            }
        } catch (e) {}
    }
</script>
</body>
</html>
